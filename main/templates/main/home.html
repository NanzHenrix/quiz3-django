```html
<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #292929;
            color: #ffffff;
            padding: 14px;
            text-align: left;
            border-bottom: 2px solid #444444;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #333333;
            color: #dddddd;
        }

        tr:hover {
            background-color: #252525;
        }

        .empty {
            text-align: center;
            color: #999999;
            padding: 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student List</h1>

    <p class="subtitle">Registered Students</p>

    <table>
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.student_id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.course }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="3" class="empty">No students found.</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
```
